# ============================================================
# Blue Heron — the menu.
# ------------------------------------------------------------
# TO CHANGE A PRICE: find the item, edit the number. That's it.
# TO ADD AN ITEM:    copy an existing block, change the fields.
# TO ADD A PHOTO:    drop the file in src/assets/food/ and put
#                    its filename in `image`.
#
# `order` controls the order sections appear. It goes up in tens so you
# can slot a new section between two existing ones without renumbering.
#
# Every `id` must be unique — it becomes the anchor link
# (#best-sellers) used by the sticky category bar.
#
# `prices` is a list so one item can carry several sizes.
# Leave `label` off when there's only one price.
# ============================================================

- id: best-sellers
  order: 10
  title: Best Sellers
  blurb: The two that people drive across town for.
  # These are the same dishes listed under Hot Sandwiches. Referencing them
  # by name instead of copying them means a price change happens in exactly
  # one place. The names must match a `name:` further down this file.
  references:
    - Philly Cheese Steak
    - Bada Bing Supreme

